# 로컬 AI 코딩 CLI 탐지 표 — gvskb 기본값 (39차, 2026-10-24).
#
# 용도: 검사 대상 **코드가** 피해자 PC 의 AI 코딩 CLI 를 "대화 없이 + 사용자 확인 생략" 으로
# 몰래 호출하는지 찾는 탐지용 표다. 2025-08 Nx·2026-02 확장 사고에서 공격자는 악성 코드를 직접
# 쓰지 않고 이미 설치된 AI CLI 에게 수집을 시켰다.
#
# 이 표는 **탐지 신호의 사전**이다(비밀값 룰의 패턴 사전과 같은 성격). 어느 옵션이 "확인 생략"인지
# 룰 본문·문서에 늘어놓지 않고 여기 한 곳에 둔다 — CLI 가 옵션을 바꾸면 이 파일만 갱신한다.
# 기관은 GVSKB_AI_CLI_FLAGS 환경변수로 자체 표를 지정할 수 있다.
schema_version: "1.0"
as_of: "2026-10-24"

# 로컬 AI 코딩 에이전트 CLI 의 실행 파일 이름(확장자·경로 제외, 소문자).
cli_names:
  - claude
  - gemini
  - codex
  - copilot
  - q           # Amazon Q
  - kiro
  - cursor-agent
  - aider
  - opencode
  - goose
  - continue
  - cline
  - amp

# 비대화식(스크립트에서 프롬프트를 한 번에 넘기는) 호출 신호 — 옵션명 또는 하위명령 토큰.
# 이것만으로는 정상(CI 자동화)일 수 있어 경고에 그친다.
noninteractive_tokens:
  - "-p"
  - "--print"
  - "--prompt"
  - "--message"
  - "--input"
  - "exec"
  - "run"
  - "chat"
  - "--non-interactive"
  - "--no-interactive"
  - "--headless"
  - "--batch"

# 사용자 확인(권한 승인)을 건너뛰게 하는 신호 — 이것이 비대화식과 함께 있으면 확정 신호.
# 각 CLI 의 가장 느슨한 권한 옵션들을 모았다(세부 조합은 CLI 문서를 따른다).
permission_skip_tokens:
  - "--dangerously-skip-permissions"
  - "--yolo"
  - "--trust-all-tools"
  - "--trust-all"
  - "--allow-all"
  - "--auto-approve"
  - "--auto-accept"
  - "--no-confirm"
  - "--no-approval"
  - "--skip-permissions"
  - "--bypass-permissions"
  - "--force"
  - "--full-auto"
  - "--sandbox=danger-full-access"
  - "--approval-mode=never"
  - "--permission-mode=bypasspermissions"
  - "--yes"

# 백그라운드·출력 은폐 신호 — 비대화식 AI CLI 호출이 이것과 결합하면 확신도를 올린다.
background_tokens:
  - "detached"
  - "nohup"
  - "start /b"
  - "-windowstyle hidden"
  - "disown"
  - "setsid"
  - ">/dev/null"
  - "2>&1"
  - "stdio: 'ignore'"
  - 'stdio: "ignore"'
