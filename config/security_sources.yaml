version: "2026-05-31"
purpose: "법령, 공공 지침, 국제 보안 기준, 취약점 API의 갱신 주기 관리"
principles:
  - "소스코드 전문과 개인정보는 외부 취약점 API로 보내지 않는다."
  - "법령과 공공 지침 변경은 자동 반영하지 않고 보안 담당자 검토 후 approved 룰로 승격한다."
  - "취약점 데이터는 online-restricted 모드에서 패키지명, 버전, CVE ID 중심으로만 조회한다."

