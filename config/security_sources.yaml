vulnerability_sources:
  - id: OSV
    name: OSV.dev API
    url: "https://google.github.io/osv.dev/api/"
    endpoints: ["POST https://api.osv.dev/v1/query", "POST https://api.osv.dev/v1/querybatch"]
    cadence: on_package_install_and_daily_batch
    payload_policy: package_name_version_only
  - id: NVD
    name: NIST NVD API 2.0
    url: "https://nvd.nist.gov/developers/vulnerabilities"
    endpoint: "GET https://services.nvd.nist.gov/rest/json/cves/2.0"
    cadence: twice_daily_or_more
    notes:
      - "NVD data feeds are documented as approximately two-hour update feeds."
      - "NIST announced SSVC and affected data expansion for CVE feed/API results starting 2026-06-17."
  - id: CISA-KEV
    name: CISA Known Exploited Vulnerabilities Catalog
    url: "https://www.cisa.gov/known-exploited-vulnerabilities-catalog"
    cadence: every_4h_to_daily
