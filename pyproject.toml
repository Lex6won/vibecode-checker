[project]
name = "vibecode-checker"
# 버전은 src/gvskb/__init__.py 의 __version__ 이 단일 원천 — hatch 가 동적으로 읽는다.
# (pyproject 정적 버전과 코드 버전이 어긋나 server_status 가 오보고하던 문제의 재발 방지)
dynamic = ["version"]
description = "Public-sector vibe-coding security knowledge base and MCP guardrail"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.11"
authors = [{ name = "Lex6won", email = "firstwon77@gmail.com" }]
keywords = ["mcp", "security", "vibe-coding", "public-sector", "korean", "llm-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    # PolyForm Noncommercial 1.0.0 은 OSI 승인 라이선스가 아니므로 대응하는
    # "License :: OSI Approved ::" 분류자가 없다. 분류자를 비워 두고 license
    # 필드(SPDX: PolyForm-Noncommercial-1.0.0)와 LICENSE 파일이 원천이 된다.
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
# 상·하한을 함께 지정해 망분리 신규 설치 시 의존성 표류를 막는다(검증 버전 기준).
# fastmcp 는 2→3 API 변화가 있었으므로 메이저 상한을 명시한다.
dependencies = [
    "fastmcp>=2.0.0,<4",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
# 상한을 둔다 — 린터·테스트 러너의 기본 동작 변경이 CI 를 깨뜨린 실측 사례가 있다
# (ruff 0.16 의 기본 규칙 확대). 상향은 의도적 결정으로만 한다.
dev = ["pytest>=8.0,<10", "ruff>=0.5,<1"]

[project.scripts]
gvskb-server = "gvskb.server:main"
gvskb = "gvskb.cli:main"

[project.urls]
Homepage = "https://github.com/Lex6won/vibecode-checker"
Issues = "https://github.com/Lex6won/vibecode-checker/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/gvskb/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gvskb"]
# Single source of truth: ship the canonical rules/ tree (141 MD) inside the wheel
# under gvskb/rules. This guarantees parity between development checkout and
# installed package — see the importlib.resources fallback in src/gvskb/server.py.
force-include = { "rules" = "gvskb/rules", "policies" = "gvskb/policies", "config" = "gvskb/config" }
exclude = ["src/gvskb/rules/"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# 규칙 집합을 **명시적으로 고정**한다. ruff 의 기본 선택은 버전마다 바뀌는데,
# 0.16 에서 대폭 확대되면서(BLE001·UP017·I001·DTZ011 …) CI 가 코드 변경 없이
# 갑자기 139건 실패했다 — 로컬(0.15)은 통과하는데 CI 만 깨지는 상태였다.
# 여기 적힌 집합이 이 저장소가 실제로 지켜온 기준이며, 새 규칙 도입은
# 일괄 정리와 함께 의도적으로 하기 위해 별도 결정으로 남긴다.
#
# 특히 BLE001(광범위 except)은 이 프로젝트가 **의도적으로** 쓰는 패턴이다:
# 감사로그·인텔 갱신·진단 실패가 검사 자체를 막으면 안 되므로 넓게 잡고
# 경고만 남긴다(각 지점에 사유 주석이 있다).
select = ["E4", "E7", "E9", "F"]
