# 의존성 트랙 (gvskb scan 은 .txt 미스캔 → check-package 경로로 별도 측정)
dependency_track:
  pypi:
    file: f_dependencies/requirements.txt
    vulnerable: [flask, pyyaml, requests]
    typosquat: [reqeusts]
  npm:
    file: f_dependencies/package.json
    vulnerable: [lodash, minimist]
    typosquat: [expresss]

