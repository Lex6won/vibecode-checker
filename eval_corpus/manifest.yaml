# gvskb 독립 벤치마크 — ground truth manifest
# kind: vulnerability(탐지 대상) | negative_control(파일 단위 FP 측정) | hard_variant(경계 프로브)
# 매칭: file 일치 AND |finding.line - line| <= 2 AND (finding.rule_id in expected_rule_ids OR category 일치)
# expected_rule_ids 는 스모크 스캔 관측값으로 채움(취약점 시딩은 독립적). 빈 목록이면 category 로만 매칭.
# sink: 드라이버가 해당 라인에 이 문자열이 실재하는지 자가 검증.

