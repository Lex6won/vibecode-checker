name: update-intel

# 일일 위협 인텔 갱신 — OSV(PyPI·npm 악성+취약점) · CISA KEV · NVD(최근 7일, 전
# 페이지) · FIRST EPSS · KNVD 공식 RSS 2종 을 받아 검증 가능한 번들로 게시한다.
#
# 이 잡의 핵심은 **누적**이다. NVD·EPSS·KNVD 는 "창(window)" 소스라 하루치만
# 주므로, 이전 번들을 먼저 복원하고 그 위에 새 수집분을 병합해야 데이터가 쌓인다.
# 예전 구조는 매번 빈 캐시에서 시작했다 — 코드에 병합 함수가 있어도 러너에는
# 이전 캐시가 없어서 실제 배포본은 한 번도 누적된 적이 없었다(실측 2026-09-13).
#
# 순서: checkout → 설치 → 이전 intel-latest 복원(sha256 검증 → import) → 새 수집
# (정상 소스 갱신·실패 소스는 마지막 정상본 유지) → 소스별 상태표 → 번들 export
# → rolling release 갱신 → 룰 PR → 최종 게이트.
#
# 안전 조건:
# - 이전 번들이 손상(sha256 불일치·반입 거부)이면 새 번들을 게시하지 않는다.
# - NVD 가 페이지 일부만 받았으면 어댑터가 예외를 내고 기존 NVD 캐시가 남는다.
# - 한 소스가 실패해도 다른 정상 소스를 빈 데이터로 덮지 않는다(소스별 파일).
# - 첫 실행(이전 번들 없음)은 bootstrap 으로 명시한다.
# - Actions cache 는 쓰지 않는다 — 보존 수단은 릴리스 자산 + 실행별 artifact.
# - 스케줄과 수동 실행이 겹치지 않도록 concurrency 를 둔다(취소 없이 직렬화).
#
# 스케줄은 기본 브랜치에서만 돈다 — 병합 후 workflow_dispatch 로 실운영 확인이 필요하다.

on:
  schedule:
    # 18:17 UTC = 03:17 KST. 정각(0분)은 GitHub Actions 부하로 지연·누락될 수 있어 피한다.
    - cron: "17 18 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Which sources to refresh (--source value or 'all')"
        required: false
        default: "all"

# 최소 권한 원칙 — 기본은 읽기. 릴리스 갱신에 필요한 쓰기는 잡 단위로만 준다.
# 룰 PR 은 INTEL_PR_TOKEN(PAT) 으로 만들므로 GITHUB_TOKEN 에 pull-requests 권한은 필요 없다.
permissions:
  contents: read

concurrency:
  group: update-intel
  cancel-in-progress: false

env:
  GVSKB_CACHE_DIR: ${{ github.workspace }}/.gvskb-cache
  BUNDLE_NAME: gvskb-intel-bundle.zip
  #: 캐시 나이 허용치(일). 이 날수만큼 연속 실패한 소스가 있으면 잡을 빨간불로 만든다.
  #: 하루 실패는 경고(마지막 정상본 유지), 계속 실패는 오류 — 조용히 낡는 것을 막는다.
  MAX_SOURCE_AGE_DAYS: "3"

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # intel-latest 릴리스 자산 갱신
    # npm 데이터셋(~220MB)을 함께 받고 NVD 를 페이지 순회하므로 여유를 둔다.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gvskb
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      # ------------------------------------------------------------------
      # 1) 이전 번들 복원 — 누적의 전제. 상태: restored | bootstrap | corrupt
      # ------------------------------------------------------------------
      - name: 이전 intel-latest 번들 복원
        id: restore
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p prev "$GVSKB_CACHE_DIR"
          if ! gh release view intel-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "state=bootstrap" >> "$GITHUB_OUTPUT"
            echo "이전 릴리스 없음 — bootstrap(첫 실행)으로 시작합니다."
            exit 0
          fi
          if ! gh release download intel-latest --repo "$GITHUB_REPOSITORY" \
               -p "$BUNDLE_NAME" -p "$BUNDLE_NAME.sha256" -D prev --clobber; then
            echo "state=bootstrap" >> "$GITHUB_OUTPUT"
            echo "릴리스는 있으나 번들 자산이 없음 — bootstrap 으로 시작합니다."
            exit 0
          fi
          # 사이드카 형식: "<sha256>  gvskb-intel-bundle.zip" — 같은 폴더에서 검증한다.
          if ! (cd prev && sha256sum -c "$BUNDLE_NAME.sha256"); then
            echo "state=corrupt" >> "$GITHUB_OUTPUT"
            echo "::error::이전 번들 sha256 불일치 — 게시된 번들이 손상됐습니다. 새 번들을 덮어쓰지 않고 중단합니다."
            exit 1
          fi
          if ! gvskb intel-bundle import "prev/$BUNDLE_NAME" --cache-dir "$GVSKB_CACHE_DIR"; then
            echo "state=corrupt" >> "$GITHUB_OUTPUT"
            echo "::error::이전 번들 반입 거부(manifest·파일 sha256 전수 검증 실패) — 중단합니다."
            exit 1
          fi
          echo "state=restored" >> "$GITHUB_OUTPUT"
          python scripts/intel_summary.py --cache-dir "$GVSKB_CACHE_DIR" \
            --title "복원한 이전 번들(누적 기준)" >> "$GITHUB_STEP_SUMMARY" || true

      # ------------------------------------------------------------------
      # 2) 새 수집 — 정상 소스는 갱신, 실패 소스는 어댑터/오케스트레이터가 이전
      #    캐시를 그대로 둔다(warn). 종료 코드는 결과 JSON 과 함께 게이트가 해석한다.
      # ------------------------------------------------------------------
      - name: Refresh intel cache + promote KEV proposed rules
        id: refresh
        if: steps.restore.outcome == 'success'
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # npm 생태계 포함 — 배포 번들은 반드시 npm 을 담는다(PyPI 와 대칭인 정식 축).
          GVSKB_OSV_INCLUDE_NPM: "1"
        run: |
          set -u
          SRC="${{ inputs.sources || 'all' }}"
          set +e
          if [ "$SRC" = "all" ]; then
            gvskb update-intel --all --promote --json > intel-result.json
          else
            gvskb update-intel --source "$SRC" --promote --json > intel-result.json
          fi
          rc=$?
          set -e
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "update-intel exit code: $rc (0=all ok, 1=warn: 일부 실패·정상본 유지, 2=error: 정상본 없는 실패)"
          cat intel-result.json

      # ------------------------------------------------------------------
      # 3) 소스별 상태표 — freshness · item count · 커버리지 · 이번 갱신 결과.
      #    나이 초과(연속 실패)·정상본 없는 실패가 있으면 exit 1 → 게이트가 읽는다.
      # ------------------------------------------------------------------
      - name: 소스별 상태 기록
        id: sources
        if: steps.restore.outcome == 'success'
        continue-on-error: true
        run: |
          python scripts/intel_summary.py --cache-dir "$GVSKB_CACHE_DIR" \
            --results intel-result.json --max-age-days "$MAX_SOURCE_AGE_DAYS" \
            --title "이번 실행 후 인텔 소스 상태 (복원: ${{ steps.restore.outputs.state }})" \
            | tee sources-summary.md
          cat sources-summary.md >> "$GITHUB_STEP_SUMMARY"

      # ------------------------------------------------------------------
      # 산출물 1: 검증 가능한 인텔 번들(고정 URL). 복원이 정상이었고 수집 단계가
      # 실행됐으면 게시한다 — 일부 소스 실패는 마지막 정상본이 포함되므로 게시가
      # 맞다(아무것도 안 하면 사용자 캐시가 더 낡는다). 정상본 없는 실패(error)나
      # 나이 초과는 게시 후 게이트가 빨간불로 알린다.
      # ------------------------------------------------------------------
      - name: Export verified intel bundle
        id: bundle
        if: steps.restore.outcome == 'success' && steps.refresh.outcome == 'success'
        run: |
          gvskb intel-bundle export "$BUNDLE_NAME" --cache-dir "$GVSKB_CACHE_DIR"
          sha256sum "$BUNDLE_NAME" > "$BUNDLE_NAME.sha256"
          cat "$BUNDLE_NAME.sha256"

      - name: Upload bundle artifact (traceability)
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gvskb-intel-bundle-${{ github.run_id }}
          path: |
            gvskb-intel-bundle.zip
            gvskb-intel-bundle.zip.sha256
          retention-days: 30

      - name: Publish bundle to rolling release (intel-latest)
        id: publish
        if: steps.bundle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESTORE_STATE: ${{ steps.restore.outputs.state }}
        run: |
          # 고정 태그 intel-latest — 다운로드 URL이 매일 동일하게 유지된다:
          #   releases/download/intel-latest/gvskb-intel-bundle.zip
          # --latest=false: 코드 릴리스의 'Latest' 자리를 차지하지 않는다.
          if ! gh release view intel-latest >/dev/null 2>&1; then
            gh release create intel-latest \
              --title "일일 위협 인텔 번들 (자동 갱신)" \
              --notes "placeholder" --latest=false
          fi
          gh release upload intel-latest "$BUNDLE_NAME" "$BUNDLE_NAME.sha256" --clobber
          {
            echo "매일 03:17 KST 자동 갱신되는 위협 인텔 반입 번들입니다."
            echo
            echo "- 갱신 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- 누적 방식: 이전 번들 복원(${RESTORE_STATE}) 후 새 수집분 병합 — NVD·EPSS·KNVD 는 시간이 지날수록 넓어집니다"
            echo "- 소스: OSV malicious+vulns (PyPI·npm) · CISA KEV · NVD recent(전 페이지, 누적) · FIRST EPSS(누적) · KNVD 공식 RSS 2종(누적)"
            echo "- KNVD 는 피드가 최신 10건만 제공하므로 **누적분이며 전체 DB 가 아닙니다**"
            echo "- 검증: zip 내부 manifest.json(파일별 sha256) + 게시 sha256 사이드카"
            echo
            if [ -f sources-summary.md ]; then cat sources-summary.md; echo; fi
            echo "망분리 반입: 외부망 PC에서 다운로드 → sha256 확인 → USB 이동 →"
            echo "\`gvskb intel-bundle import gvskb-intel-bundle.zip\` → \`gvskb doctor --offline\`"
          } > release-notes.md
          gh release edit intel-latest --notes-file release-notes.md

      # ------------------------------------------------------------------
      # 산출물 2: KEV → proposed 룰 PR (사람 검토 게이트)
      # ------------------------------------------------------------------
      - name: Detect changes in proposed rules
        id: detect
        if: steps.refresh.outcome == 'success'
        run: |
          # git diff 는 untracked(신규) 파일을 보지 못한다 — 새 proposed 룰은
          # 항상 신규 파일이므로 status --porcelain 으로 감지해야 PR이 생성된다.
          if [ -z "$(git status --porcelain rules/intel-proposed/ 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## New proposed rules" > /tmp/pr_body.md
            git status --porcelain rules/intel-proposed/ | head -50 >> /tmp/pr_body.md
            echo >> /tmp/pr_body.md
            echo "> 자동 수명주기: 이 카드들은 지식층 전용(스캐너 집행 안 됨)이라 CI 통과 시 자동 병합됩니다." >> /tmp/pr_body.md
            echo "> 90일 내 status: approved 로 승격되지 않으면 다음 갱신에서 자동 폐기됩니다." >> /tmp/pr_body.md
            echo "> 우선 검토 후보는 매월 1일 다이제스트 이슈로 정리됩니다." >> /tmp/pr_body.md
            echo >> /tmp/pr_body.md
            echo "## update-intel output (JSON)" >> /tmp/pr_body.md
            echo '```json' >> /tmp/pr_body.md
            head -c 4000 intel-result.json >> /tmp/pr_body.md || true
            echo >> /tmp/pr_body.md
            echo '```' >> /tmp/pr_body.md
          fi

      # ------------------------------------------------------------------
      # PR 은 반드시 PAT 로 만든다 — GITHUB_TOKEN 으로 만들면 병합이 영구히 막힌다.
      #
      # 실측(PR #4, 2026-07-07 ~ 07-31, 24일 정체): GITHUB_TOKEN 이 만든 PR 에도
      # pull_request 이벤트 런은 **생성되지만** 전부 `action_required`(사람 승인
      # 대기)에서 멈춘다. 그 결과 PR head 커밋의 statusCheckRollup 이 null 이 되어
      # 룰셋은 필수 체크가 "보고되지 않았다"고 판단하고 BLOCKED 을 유지한다.
      # 승인 대기 런을 사람이 승인하자 즉시 병합됐다.
      #
      # → 시크릿 INTEL_PR_TOKEN (fine-grained PAT: contents write,
      #   pull-requests write) 로 PR 을 만들면 작성자가 실제 계정이 되어
      #   pull_request CI 가 승인 없이 정상 실행되고 자동 병합이 발동한다.
      # ------------------------------------------------------------------
      # `changed` 와 무관하게 **매번** 돈다 — 토큰 만료를 하루 안에 드러내기 위해서다.
      - name: PR 생성 토큰 점검(만료 조기 발견)
        id: prtoken
        if: steps.refresh.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.INTEL_PR_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "state=missing" >> "$GITHUB_OUTPUT"
          elif gh api "repos/${{ github.repository }}" --jq .full_name >/dev/null 2>&1; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
            echo "state=ok"        >> "$GITHUB_OUTPUT"
          else
            # 만료·폐기·권한 축소 — 어느 쪽이든 PR 을 만들지 못한다.
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "state=invalid"   >> "$GITHUB_OUTPUT"
          fi

      - name: Create pull request
        id: cpr
        if: steps.detect.outputs.changed == 'true' && steps.prtoken.outputs.available == 'true'
        # SHA 핀 — 태그는 이동할 수 있으므로 공급망 안전을 위해 커밋으로 고정 (= v6)
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6
        with:
          token: ${{ secrets.INTEL_PR_TOKEN }}
          branch: intel/auto-update
          base: main
          delete-branch: true
          add-paths: |
            rules/intel-proposed/
          commit-message: "[intel] refresh proposed rules from CISA KEV"
          title: "[intel] update CISA KEV proposed rules"
          body-path: /tmp/pr_body.md
          labels: |
            intel
            proposed-rules
            needs-review

      # 초안 카드는 지식층 전용(집행 게이트는 status: approved)이므로, 테스트가
      # 전부 통과하면 자동 병합한다.
      - name: Enable auto-merge (advisory cards only)
        if: steps.cpr.outputs.pull-request-number
        continue-on-error: true
        id: automerge
        env:
          GH_TOKEN: ${{ secrets.INTEL_PR_TOKEN }}
        run: |
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"

      # ------------------------------------------------------------------
      # 최종 게이트 — "무엇이 진짜 실패인가"를 분명히 한다.
      #
      # 빨간불(exit 1): 이전 번들 손상 · 수집 단계 자체가 실행 불가 · 정상본 없는
      #   소스 실패(error) · 캐시 나이 초과(연속 실패) · 번들 export/게시 실패.
      # 노란불(warning): 일부 소스 실패이나 마지막 정상본 유지(warn) · 룰 PR 토큰 문제.
      # ------------------------------------------------------------------
      - name: 최종 상태 게이트
        if: always()
        env:
          RESTORE: ${{ steps.restore.outcome }}
          RESTORE_STATE: ${{ steps.restore.outputs.state }}
          REFRESH: ${{ steps.refresh.outcome }}
          REFRESH_RC: ${{ steps.refresh.outputs.exit_code }}
          SOURCES: ${{ steps.sources.outcome }}
          BUNDLE: ${{ steps.bundle.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          AUTOMERGE: ${{ steps.automerge.outcome }}
          PR_NUM: ${{ steps.cpr.outputs.pull-request-number }}
          CHANGED: ${{ steps.detect.outputs.changed }}
          PR_TOKEN_STATE: ${{ steps.prtoken.outputs.state }}
        run: |
          {
            echo "### 인텔 갱신 결과"
            echo "- 이전 번들 복원: \`${RESTORE_STATE:-unknown}\` (step ${RESTORE})"
            echo "- 인텔 수집: step \`${REFRESH}\`, update-intel exit \`${REFRESH_RC:-n/a}\` (0 ok · 1 warn · 2 error)"
            echo "- 소스 상태 게이트: \`${SOURCES:-skipped}\` (failure = 나이 초과 또는 정상본 없는 실패)"
            echo "- 번들 export: \`${BUNDLE:-skipped}\` · 게시: \`${PUBLISH:-skipped}\`"
            echo "- 룰 PR: \`${AUTOMERGE:-none}\` ${PR_NUM:+(#$PR_NUM)} · PR 토큰: \`${PR_TOKEN_STATE:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          fail=0
          if [ "$RESTORE_STATE" = "corrupt" ] || [ "$RESTORE" != "success" ]; then
            echo "::error::이전 번들 복원 실패(${RESTORE_STATE:-unknown}) — 손상된 번들을 덮어쓰지 않기 위해 게시하지 않았습니다. 릴리스 자산을 확인하세요."
            echo "> ❌ **이전 번들 복원 실패** — 새 번들을 게시하지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          if [ "$REFRESH" != "success" ]; then
            echo "::error::인텔 수집 단계가 실행되지 못했습니다."
            echo "> ❌ **인텔 수집 단계 실패**" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "${REFRESH_RC:-0}" = "2" ]; then
            echo "::error::정상본이 없는 소스 수집 실패(error) — 번들에 그 소스가 빠져 있습니다. 위 상태표를 확인하세요."
            echo "> ❌ **정상본 없는 소스 실패** — 상태표의 error 소스를 확인하세요." >> "$GITHUB_STEP_SUMMARY"
            fail=1
          elif [ "${REFRESH_RC:-0}" = "1" ]; then
            echo "::warning::일부 소스 수집 실패 — 마지막 정상본을 유지한 채 번들을 게시했습니다. 상태표를 확인하세요."
            echo "> ⚠️ **일부 소스 실패(정상본 유지)** — 연속되면 ${MAX_SOURCE_AGE_DAYS}일 뒤 오류로 승격됩니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$SOURCES" = "failure" ]; then
            echo "::error::소스 상태 게이트 실패 — 캐시 나이 초과(연속 실패) 또는 정상본 없는 실패가 있습니다."
            echo "> ❌ **소스 상태 게이트 실패** — 위 상태표의 '문제' 열을 확인하세요." >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          if [ "$REFRESH" = "success" ] && { [ "$BUNDLE" != "success" ] || [ "$PUBLISH" != "success" ]; }; then
            echo "::error::번들 export/게시 실패 — intel-latest 릴리스가 갱신되지 않았습니다."
            echo "> ❌ **번들 배포 실패** — 사용자가 최신 번들을 받을 수 없습니다." >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi
          if [ "$PR_TOKEN_STATE" = "missing" ]; then
            echo "::warning::INTEL_PR_TOKEN 시크릿이 없습니다 — 새 KEV 가 나와도 룰 PR 을 만들지 못합니다."
            echo "> ⚠️ **INTEL_PR_TOKEN 미설정** — 룰 카드 반영 경로가 끊겨 있습니다(번들은 별도)." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PR_TOKEN_STATE" = "invalid" ]; then
            echo "::warning::INTEL_PR_TOKEN 으로 저장소를 조회하지 못했습니다 — 만료·폐기·권한 축소를 확인하세요."
            echo "> ⚠️ **INTEL_PR_TOKEN 무효** — 만료되었거나 권한이 부족합니다(번들은 별도)." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$CHANGED" = "true" ] && [ "$PR_TOKEN_STATE" != "ok" ]; then
            echo "::warning::새 proposed 룰이 있으나 PR 을 만들지 못했습니다(토큰 상태: ${PR_TOKEN_STATE:-unknown})."
            echo "> ⚠️ 새 룰 카드가 저장소에 반영되지 않았습니다." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$PR_NUM" ] && [ "$AUTOMERGE" != "success" ]; then
            echo "::warning::룰 PR #$PR_NUM 자동 병합 실패 — 번들과는 무관합니다. PR 을 확인하세요."
            echo "> ⚠️ 룰 PR #$PR_NUM 처리 실패(번들과 무관). 수동 확인 필요." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "> ✅ 번들 배포 완료 — 이전 번들(${RESTORE_STATE}) 위에 누적된 최신 위협 인텔을 사용자가 받습니다." >> "$GITHUB_STEP_SUMMARY"
