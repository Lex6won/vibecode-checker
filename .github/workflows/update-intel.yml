name: update-intel

# Daily refresh of external security feeds (CISA KEV, OSV, NVD, EPSS) and
# promotion of new KEV entries into rules/intel-proposed/ as status=proposed.
# Network failures must not break this workflow — air-gapped operators run
# `gvskb update-intel --from-cache` instead.

on:
  schedule:
    # 18:00 UTC daily = 03:00 KST
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Which sources to refresh (--source value or 'all')"
        required: false
        default: "all"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install gvskb
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"

      - name: Refresh intel cache + promote KEV proposed rules
        id: refresh
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GVSKB_CACHE_DIR: ${{ github.workspace }}/.gvskb-cache
        run: |
          SRC="${{ inputs.sources || 'all' }}"
          if [ "$SRC" = "all" ]; then
            gvskb update-intel --all --promote --json | tee intel-result.json
          else
            gvskb update-intel --source "$SRC" --promote --json | tee intel-result.json
          fi

      # ------------------------------------------------------------------
      # 산출물 1: 검증 가능한 인텔 번들(고정 URL) — 캐시가 러너에서 휘발되지
      # 않고 사용자에게 도달하게 하는 단계. 망분리 기관은 외부망 PC에서 이
      # 번들을 받아 sha256 확인 → USB 반입 → `gvskb intel-bundle import` 하면
      # 매일 갱신된 캐시를 그대로 쓸 수 있다.
      # ------------------------------------------------------------------
      - name: Export verified intel bundle
        id: bundle
        if: steps.refresh.outcome == 'success'
        env:
          GVSKB_CACHE_DIR: ${{ github.workspace }}/.gvskb-cache
        run: |
          gvskb intel-bundle export gvskb-intel-bundle.zip
          sha256sum gvskb-intel-bundle.zip > gvskb-intel-bundle.zip.sha256
          cat gvskb-intel-bundle.zip.sha256

      - name: Upload bundle artifact (traceability)
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: gvskb-intel-bundle-${{ github.run_id }}
          path: |
            gvskb-intel-bundle.zip
            gvskb-intel-bundle.zip.sha256
          retention-days: 30

      - name: Publish bundle to rolling release (intel-latest)
        if: steps.bundle.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 고정 태그 intel-latest — 다운로드 URL이 매일 동일하게 유지된다:
          #   releases/download/intel-latest/gvskb-intel-bundle.zip
          # --latest=false: 코드 릴리스의 'Latest' 자리를 차지하지 않는다.
          if ! gh release view intel-latest >/dev/null 2>&1; then
            gh release create intel-latest \
              --title "일일 위협 인텔 번들 (자동 갱신)" \
              --notes "placeholder" --latest=false
          fi
          gh release upload intel-latest \
            gvskb-intel-bundle.zip gvskb-intel-bundle.zip.sha256 --clobber
          gh release edit intel-latest --notes "$(printf '%s\n' \
            "매일 03:00 KST 자동 갱신되는 위협 인텔 반입 번들입니다." \
            "" \
            "- 갱신 시각(UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "- 소스: OSV malicious · CISA KEV · NVD recent · FIRST EPSS" \
            "- 검증: zip 내부 manifest.json(파일별 sha256) + 게시 sha256 사이드카" \
            "" \
            "망분리 반입: 외부망 PC에서 다운로드 → sha256 확인 → USB 이동 →" \
            "\`gvskb intel-bundle import gvskb-intel-bundle.zip\` → \`gvskb doctor --offline\`")"

      # ------------------------------------------------------------------
      # 산출물 2: KEV → proposed 룰 PR (사람 검토 게이트)
      # ------------------------------------------------------------------
      - name: Detect changes in proposed rules
        id: detect
        run: |
          # git diff 는 untracked(신규) 파일을 보지 못한다 — 새 proposed 룰은
          # 항상 신규 파일이므로 status --porcelain 으로 감지해야 PR이 생성된다.
          if [ -z "$(git status --porcelain rules/intel-proposed/ 2>/dev/null)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "## New proposed rules" > /tmp/pr_body.md
            git status --porcelain rules/intel-proposed/ | head -50 >> /tmp/pr_body.md
            echo >> /tmp/pr_body.md
            echo "> 자동 수명주기: 이 카드들은 지식층 전용(스캐너 집행 안 됨)이라 CI 통과 시 자동 병합됩니다." >> /tmp/pr_body.md
            echo "> 90일 내 status: approved 로 승격되지 않으면 다음 갱신에서 자동 폐기됩니다." >> /tmp/pr_body.md
            echo "> 우선 검토 후보는 매월 1일 다이제스트 이슈로 정리됩니다." >> /tmp/pr_body.md
            echo >> /tmp/pr_body.md
            echo "## update-intel output (JSON)" >> /tmp/pr_body.md
            echo '```json' >> /tmp/pr_body.md
            head -c 4000 intel-result.json >> /tmp/pr_body.md || true
            echo >> /tmp/pr_body.md
            echo '```' >> /tmp/pr_body.md
          fi

      - name: Create pull request
        id: cpr
        if: steps.detect.outputs.changed == 'true'
        # SHA 핀 — 태그는 이동할 수 있으므로 공급망 안전을 위해 커밋으로 고정 (= v6)
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c  # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: intel/auto-update
          base: main
          delete-branch: true
          add-paths: |
            rules/intel-proposed/
          commit-message: "[intel] refresh proposed rules from CISA KEV"
          title: "[intel] update CISA KEV proposed rules"
          body-path: /tmp/pr_body.md
          labels: |
            intel
            proposed-rules
            needs-review

      # 초안 카드는 지식층 전용(집행 게이트는 status: approved)이므로, 테스트가
      # 전부 통과하면 자동 병합한다 — 사람의 결정은 "스캐너 집행 승격"과 월간
      # 다이제스트 검토로 옮겨진다(1인 운영에서 PR 수동 병합 부담 제거).
      - name: Enable auto-merge (advisory cards only)
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge --squash --auto "${{ steps.cpr.outputs.pull-request-number }}"
          # GITHUB_TOKEN으로 만든 PR에는 pull_request CI가 자동 실행되지 않는다
          # (GitHub 재귀 방지) — 필수 체크(pytest)가 돌도록 직접 호출한다.
          gh workflow run test.yml --ref intel/auto-update
