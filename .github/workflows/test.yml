name: test

on:
  push:
  pull_request:
  # update-intel이 GITHUB_TOKEN으로 만든 PR은 pull_request 트리거가 돌지 않는다
  # (GitHub 재귀 방지) — 그 경우 워크플로가 이 트리거로 CI를 직접 호출한다.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests
      - name: Test
        run: pytest -q
